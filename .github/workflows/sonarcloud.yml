name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      # 🔥 REQUIRED: checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # important for PR/branch analysis

      # 🔍 SonarCloud scan
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=rbr-systems_weddia
            -Dsonar.organization=rbr-systems
            -Dsonar.sources=.
            -Dsonar.qualitygate.wait=true
          projectBaseDir: .
